[project]
name = "docorganizer"
version = "0.1.0"
description = "Document inbox organizer — classifies, renames, and files documents"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "deepl",
    "pdfplumber",
    "python-docx",
    "python-dotenv",
    "pyyaml",
    "xattr",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pillow",
    "reportlab",
]

[project.scripts]
docorganizer = "docorganizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
